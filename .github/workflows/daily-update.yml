# Fetches new data, commits it, and redeploys the site.
# The three commented-out steps get switched on as those scripts are written.

name: Daily update

on:
  schedule:
    # 05:30 UTC, Tuesday to Saturday: each run processes the previous trading day,
    # after the US close and after GDELT has finished that UTC day.
    - cron: "30 5 * * 2-6"
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write # commit updated data
  pages: write # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch volatility indices and prices
        run: python -m pipeline.fetch_vol

      # GDELT sometimes refuses requests from GitHub's shared machines.
      # If that happens the run carries on and the next run fills the gap.
      - name: Fetch GDELT news series
        continue-on-error: true
        run: python -m pipeline.fetch_news

      # - name: Build aligned feature table
      #   run: python -m pipeline.build_features

      # - name: Fit baseline and news models
      #   run: python -m pipeline.fit

      # - name: Export JSON for the site
      #   run: python -m pipeline.export

      # Runs even if a step above failed, so whatever was fetched is kept.
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git pull --rebase
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
