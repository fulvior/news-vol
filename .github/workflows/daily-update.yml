# Fetches new data, commits it, and redeploys the site.

name: Daily update

on:
  schedule:
    # 05:30 UTC, Tuesday to Saturday: each run processes the previous trading day,
    # after the US close and after GDELT has finished that UTC day.
    - cron: "30 5 * * 2-6"
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write # commit updated data
  pages: write # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-semantic.txt

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('pipeline/config.yml') }}
          restore-keys: hf-models-

      - name: Fetch volatility indices and prices
        run: python -m pipeline.fetch_vol

      # If GDELT is unreachable the run carries on, so the volatility data and
      # the site still update; the next run fills the gap.
      - name: Fetch GDELT news series
        continue-on-error: true
        run: python -m pipeline.fetch_news

      # Headline topics and tone; like the news step, a failure here does not
      # stop the update, and the next run fills the gap.
      - name: Fetch semantic news series
        continue-on-error: true
        run: python -m pipeline.fetch_semantic

      - name: Build aligned feature table
        run: python -m pipeline.build_features

      - name: Fit volatility models
        run: python -m pipeline.fit

      - name: Export JSON for the site
        run: python -m pipeline.export

      # Runs even if a step above failed, so whatever was fetched is kept.
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Files rebuilt from scratch every run (feature tables, the site's JSON) are not
          # kept in the repository: they are regenerated here and deployed directly, and
          # committing them daily would grow the repository by hundreds of MB a year.
          git rm -r --cached --quiet --ignore-unmatch site/data data/features data/checks
          git add .gitignore data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git pull --rebase
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
