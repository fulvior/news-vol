# One-off job: builds the news history from GDELT's raw files, one year per job.
# Start it by hand from the Actions tab. If a year does not finish within its
# time budget, run the workflow again: it skips the days already stored.

name: Backfill news

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news for ${{ matrix.year }}
        run: >
          python -m pipeline.fetch_news
          --start ${{ matrix.year }}-01-01
          --end ${{ matrix.year }}-12-31
          --max-minutes 300

      # Each year writes its own file, so the parallel jobs never edit the same
      # file; the retry loop only handles two jobs pushing at the same moment.
      - name: Commit news for ${{ matrix.year }}
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Backfill news ${{ matrix.year }}"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase && git push; then exit 0; fi
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
