# Calibrates the semantic topics on a large sample of GDELT headlines.
# Start it by hand from the Actions tab; it takes about an hour and a half.
# The report appears on the run's summary page. The labelling sheet, the scores
# and the fitted model can be downloaded as "topic-calibration" at the bottom of
# that page. Nothing is committed to the repository.
# If data/labels/topic_labels.csv exists, the report also checks precision
# against those labels and recommends a threshold per topic.

name: Calibrate topics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-semantic.txt

      # Keeps the downloaded models between runs.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('pipeline/config.yml') }}
          restore-keys: hf-models-

      - name: Calibrate topics
        run: python -m pipeline.calibrate_topics

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-calibration
          path: data/checks/
          if-no-files-found: ignore
