# One-off check: scores the sampled headlines against the topics in config.yml.
# Needs data/checks/headline_sample.csv in the repository (from "Check headlines").
# The report appears on the run's summary page; all scores can be downloaded
# from the bottom of that page. Nothing is committed to the repository.

name: Calibrate topics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-semantic.txt

      # Keeps the downloaded models between runs.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('pipeline/config.yml') }}
          restore-keys: hf-models-

      - name: Score headlines against the topics
        run: python -m pipeline.calibrate_topics

      - name: Keep the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-scores
          path: data/checks/topic_scores.csv
          if-no-files-found: ignore
