# Everything the pipeline needs to know lives here.
# Adding an instrument or a news theme should only ever mean editing this file.

start_date: "2017-01-01"   # GDELT's GKG 2.0 files exist from February 2015

# ---------------------------------------------------------------- instruments
# source: cboe  -> CSV published by Cboe (DATE, OPEN, HIGH, LOW, CLOSE)
# source: stoxx -> semicolon-separated history file published by STOXX
# source: yahoo -> daily OHLC through yfinance (unofficial, used for realized vol)
# kind: implied  -> the series is already a volatility index
# kind: realized -> the series is a price; build_features turns it into realized vol
# news_region must match a key under news.regions.
instruments:
  vix:
    name: VIX
    kind: implied
    source: cboe
    url: https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv
    news_region: us
    close: {time: "16:15", tz: America/New_York}

  vstoxx:
    name: VSTOXX
    kind: implied
    source: stoxx
    url: https://www.stoxx.com/document/Indices/Current/HistoricalData/h_v2tx.txt
    fallback_ticker: "^V2TX"     # tried through yfinance if the STOXX file fails
    news_region: europe
    close: {time: "17:30", tz: Europe/Berlin}

  spx_rv:
    name: S&P 500 realized volatility
    kind: realized
    source: yahoo
    ticker: "^GSPC"
    news_region: us
    close: {time: "16:00", tz: America/New_York}

  sx5e_rv:
    name: EURO STOXX 50 realized volatility
    kind: realized
    source: yahoo
    ticker: "^STOXX50E"
    news_region: europe
    close: {time: "17:30", tz: Europe/Berlin}

# ----------------------------------------------------------------------- news
# News comes from GDELT's raw Global Knowledge Graph (GKG 2.0) files: one file
# every 15 minutes, one row per article. They are plain downloads with no
# request limit.
news:
  base_url: http://data.gdeltproject.org/gdeltv2/
  # GDELT's table of news outlets and the country each one publishes from.
  domain_lookup_url: http://data.gdeltproject.org/blog/2018-news-outlets-by-country-may2018-update/MASTER-GDELTDOMAINSBYCOUNTRY-MAY2018.TXT

  slots_per_day: 24          # how many of the 96 daily files to read (24 = one per hour)
  include_translated: true   # also read the files of articles translated into English
                             # (needed for German, French, Italian and Spanish outlets)
  lookback_days: 10          # the daily run fills any missing day in this window
  threads: 6                 # parallel downloads

  # Outlets are grouped by the country they publish from (FIPS codes).
  regions:
    us: [US]
    europe: [UK, GM, FR, IT, SP]

  # GDELT GKG theme codes; an article counts if it carries any code in the list.
  # A misspelled code silently matches nothing, so fetch_news warns about any
  # theme that never appears.
  themes:
    stock_market: [ECON_STOCKMARKET]
    central_banks: [ECON_CENTRALBANK]
    interest_rates: [ECON_INTEREST_RATES]
    inflation: [ECON_INFLATION]
    policy_uncertainty: [EPU_POLICY]
    trade_disputes: [ECON_TRADE_DISPUTE]
    oil_prices: [ECON_OILPRICE]
    armed_conflict: [ARMEDCONFLICT]

# ------------------------------------------------------------------- semantic
# Topics defined by meaning rather than by GDELT's theme codes, scored on
# headlines. Headlines exist in GDELT from the second half of 2019.
#
# Two models: a fast static one screens every headline, and a slower
# transformer re-scores the ones that pass and measures tone. Both are
# multilingual, so English anchors also match German, French, Italian and
# Spanish headlines; a few non-English anchors per topic help the fast model,
# whose cross-language matching is weaker.
#
# Each topic has:
#   anchors  sentences typical of headlines on the topic
#   calm     headlines where the topic signals easing or good news
#   stress   headlines where it signals worsening or risk
# Tone is how much closer a headline is to "stress" than to "calm".
semantic:
  screen_model: minishlab/potion-multilingual-128M
  score_model: intfloat/multilingual-e5-small
  score_prefix: "query: "          # the e5 models expect this before every text
  screen_share: 0.05               # calibration: share of headlines passed to the second model per topic

  topics:
    inflation:
      anchors:
        - Inflation rose more than expected last month
        - Consumer prices climb as cost of living keeps rising
        - Core inflation eases but remains above target
        - Food and energy prices push inflation higher
        - L'inflazione sale ancora, rincari su bollette e carrello della spesa
        - Inflationsrate steigt auf höchsten Stand seit Jahren
        - La inflación se modera en el último mes
        - L'inflation ralentit mais les prix restent élevés
      calm:
        - Inflation cools faster than expected
        - Price pressures ease as inflation falls toward target
      stress:
        - Inflation surges to a multi-decade high
        - Prices soar as inflation spirals out of control

    monetary_policy:
      anchors:
        - The Federal Reserve raises interest rates by a quarter point
        - ECB holds rates steady and signals cuts ahead
        - Central bank chief warns rates may stay higher for longer
        - Bond yields jump on expectations of more rate hikes
        - La Bce alza i tassi di interesse
        - EZB senkt den Leitzins
        - La Reserva Federal recorta los tipos de interés
        - La BCE maintient ses taux directeurs
      calm:
        - Central bank cuts rates to support the economy
        - Fed signals a pause in rate hikes
      stress:
        - Central bank delivers surprise jumbo rate hike
        - Bond market sell-off as rate hike fears mount

    equity_markets:
      anchors:
        - Stocks fall sharply as investors flee risk
        - Wall Street rallies to a record high
        - European shares slide on growth worries
        - Market volatility spikes amid sell-off
        - Borsa Milano chiude in calo, vendite sulle banche
        - DAX schließt mit deutlichen Verlusten
        - El Ibex 35 cae arrastrado por la banca
        - Le CAC 40 recule dans un marché nerveux
      calm:
        - Stocks rise to record highs in a calm market
        - Shares rebound as investor fears ease
      stress:
        - Stock market crash wipes out billions
        - Global markets plunge in panic selling

    trade_tariffs:
      anchors:
        - New tariffs announced on imports from China
        - Trade war escalates as both sides raise duties
        - Trade talks make progress toward a deal
        - Exporters hit by retaliatory tariffs
        - Dazi americani, colpite le esportazioni europee
        - Zölle belasten die deutsche Exportwirtschaft
        - Aranceles de Estados Unidos golpean a las exportaciones
        - Les droits de douane menacent les exportateurs français
      calm:
        - Trade deal reached, tariffs to be lifted
        - Tariff truce eases trade tensions
      stress:
        - Trade war escalates with sweeping new tariffs
        - Retaliatory tariffs threaten global trade

    energy:
      anchors:
        - Oil prices jump after OPEC cuts output
        - Natural gas prices soar in Europe
        - Crude falls on fears of weaker demand
        - Energy bills rise for households and businesses
        - Prezzo del gas alle stelle, bollette in aumento
        - Ölpreis steigt nach Förderkürzung der Opec
        - El precio del petróleo se dispara
        - Les prix de l'énergie flambent en Europe
      calm:
        - Oil prices fall as supply concerns ease
        - Gas prices drop as storage fills up
      stress:
        - Oil prices spike on supply disruption fears
        - Energy crisis deepens as gas prices hit records

    geopolitics:
      anchors:
        - Missile strikes escalate the conflict
        - Troops mass at the border as tensions rise
        - Sanctions imposed after the invasion
        - Ceasefire talks resume between the warring sides
        - Attacco missilistico, cresce la tensione internazionale
        - Russland greift die Ukraine mit Drohnen an
        - Escalada militar en Oriente Medio
        - Les tensions géopolitiques s'intensifient
      calm:
        - Ceasefire agreed as peace talks advance
        - Tensions ease after diplomatic breakthrough
      stress:
        - War escalates with massive missile attack
        - Fears of wider conflict as fighting spreads

    banking_stress:
      anchors:
        - Bank shares tumble amid fears over deposits
        - Regulators step in to rescue a failing lender
        - Credit markets tighten as defaults rise
        - Bank run sparks contagion fears
        - Crisi bancaria, titoli in caduta libera
        - "Bankenkrise: Angst vor Ansteckung wächst"
        - Rescate bancario para evitar el contagio
        - Les banques chutent en Bourse, crainte de contagion
      calm:
        - Banks report strong results and solid capital
        - Fears of banking crisis ease after rescue
      stress:
        - Bank collapse sparks fears of financial contagion
        - Depositors pull billions as bank crisis spreads

    growth_labor:
      anchors:
        - Economy slips into recession as output shrinks
        - Unemployment rises as companies cut jobs
        - GDP growth beats expectations
        - Jobs report shows strong hiring last month
        - Il Pil italiano rallenta, rischio recessione
        - Deutsche Wirtschaft schrumpft, Rezession droht
        - El paro baja y el empleo crece con fuerza
        - La croissance française ralentit au troisième trimestre
      calm:
        - Economy grows strongly and hiring picks up
        - Unemployment falls to a record low
      stress:
        - Economy plunges into deep recession
        - Mass layoffs as unemployment soars
