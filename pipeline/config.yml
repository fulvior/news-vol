# Everything the pipeline needs to know lives here.
# Adding an instrument or a news theme should only ever mean editing this file.

start_date: "2017-01-01"   # GDELT's GKG 2.0 files exist from February 2015

# ---------------------------------------------------------------- instruments
# source: cboe  -> CSV published by Cboe (DATE, OPEN, HIGH, LOW, CLOSE)
# source: stoxx -> semicolon-separated history file published by STOXX
# source: yahoo -> daily OHLC through yfinance (unofficial, used for realized vol)
# kind: implied  -> the series is already a volatility index
# kind: realized -> the series is a price; build_features turns it into realized vol
# news_region must match a key under news.regions.
instruments:
  vix:
    name: VIX
    kind: implied
    source: cboe
    url: https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv
    news_region: us
    close: {time: "16:15", tz: America/New_York}

  vstoxx:
    name: VSTOXX
    kind: implied
    source: stoxx
    url: https://www.stoxx.com/document/Indices/Current/HistoricalData/h_v2tx.txt
    fallback_ticker: "^V2TX"     # tried through yfinance if the STOXX file fails
    news_region: europe
    close: {time: "17:30", tz: Europe/Berlin}

  spx_rv:
    name: S&P 500 realized volatility
    kind: realized
    source: yahoo
    ticker: "^GSPC"
    news_region: us
    close: {time: "16:00", tz: America/New_York}

  sx5e_rv:
    name: EURO STOXX 50 realized volatility
    kind: realized
    source: yahoo
    ticker: "^STOXX50E"
    news_region: europe
    close: {time: "17:30", tz: Europe/Berlin}

# ----------------------------------------------------------------------- news
# News comes from GDELT's raw Global Knowledge Graph (GKG 2.0) files: one file
# every 15 minutes, one row per article. They are plain downloads with no
# request limit.
news:
  base_url: http://data.gdeltproject.org/gdeltv2/
  # GDELT's table of news outlets and the country each one publishes from.
  domain_lookup_url: http://data.gdeltproject.org/blog/2018-news-outlets-by-country-may2018-update/MASTER-GDELTDOMAINSBYCOUNTRY-MAY2018.TXT

  slots_per_day: 24          # how many of the 96 daily files to read (24 = one per hour)
  include_translated: true   # also read the files of articles translated into English
                             # (needed for German, French, Italian and Spanish outlets)
  lookback_days: 10          # the daily run fills any missing day in this window
  threads: 6                 # parallel downloads

  # Outlets are grouped by the country they publish from (FIPS codes).
  regions:
    us: [US]
    europe: [UK, GM, FR, IT, SP]

  # GDELT GKG theme codes; an article counts if it carries any code in the list.
  # A misspelled code silently matches nothing, so fetch_news warns about any
  # theme that never appears.
  themes:
    stock_market: [ECON_STOCKMARKET]
    central_banks: [ECON_CENTRALBANK]
    interest_rates: [ECON_INTEREST_RATES]
    inflation: [ECON_INFLATION]
    policy_uncertainty: [EPU_POLICY]
    trade_disputes: [ECON_TRADE_DISPUTE]
    oil_prices: [ECON_OILPRICE]
    armed_conflict: [ARMEDCONFLICT]

# ------------------------------------------------------------------- semantic
# Topics defined by meaning rather than by GDELT's theme codes, measured on
# headlines (GDELT has them from the second half of 2019).
#
# How a headline is assigned to a topic:
#   1. keywords: precise multilingual patterns (regular expressions, case is
#      ignored except inside (?-i:...)). A match makes the headline a clear
#      example of the topic, unless it also matches an `exclude` pattern.
#   2. a classifier per topic, trained on the clear examples, recognises
#      headlines on the topic that use none of the keywords. The keywords are
#      hidden from it during training, so it has to learn from the rest of
#      the wording.
#   3. a headline belongs to the topic if it matches the keywords or the
#      classifier's probability reaches the topic's threshold. Thresholds are
#      set from hand-labelled examples (data/labels/topic_labels.csv).
#
# Tone: each topic has "calm" and "stress" sentences (English is enough: the
# model is multilingual). A headline's tone is how much closer it is to the
# stress sentences than to the calm ones, measured with the slower model.
semantic:
  languages: [eng, deu, fra, ita, spa]
  screen_model: minishlab/potion-multilingual-128M     # fast, used for topics
  score_model: intfloat/multilingual-e5-small          # slower, used for tone
  score_prefix: "query: "                              # the e5 models expect this before every text

  calibration:
    start: "2019-08-01"            # first month with headlines
    days_per_month: [5, 20]        # days sampled in every month
    slots: ["080000", "160000"]    # UTC times of the files read on each day
    max_headlines: 250000          # random subset used if the sample is larger
    classifier_models: [screen]    # embeddings the topic classifiers are trained on; [screen, score] compares both
    min_examples: 30               # fewer keyword matches than this: no classifier
    target_precision: 0.80         # used to recommend thresholds from labels
    drop_share: 0.02               # keyword-free headlines most similar to a topic, left out of its negatives
    tone_sample: 1500              # headlines per topic scored for tone
    # Days with major market events, added so that rarer topics have enough examples.
    extra_days: [2020-03-09, 2020-03-12, 2020-03-16, 2020-03-18, 2022-02-24, 2022-02-25,
                 2022-03-08, 2022-06-13, 2022-06-15, 2022-07-13, 2022-09-23, 2022-09-28,
                 2023-03-10, 2023-03-13, 2023-03-15, 2023-03-17, 2023-03-20, 2023-05-01,
                 2023-10-09, 2024-08-05, 2024-10-01, 2025-04-03, 2025-04-04, 2025-04-07,
                 2025-04-09, 2025-06-13]

  topics:
    inflation:
      keywords:
        - '\b(dis|de)?inflation(ary|s)?\b'
        - '\bconsumer price(s| index)\b'
        - '(?-i:\bCPI\b|\bHICP\b|\bPCE\b)'
        - '\bcost[- ]of[- ]living\b'
        - '\binflationsrate\b|\bteuerung(srate)?\b|\bverbraucherpreise\b'
        - '\binflazione\b|\bcarovita\b|\bprezzi al consumo\b'
        - '\binflaci[oó]n\b|\bprecios al consumo\b'
        - '(?-i:\bIPC\b)(?=\s+(?i:sube|subi[oó]|baja|baj[oó]|se\s|interanual|general|subyacente|armonizado|de\s|del\s|en\s|cierra|repunta|modera))'
        - '\bprix à la consommation\b|\bhausse des prix\b'
      exclude:
        - '\binflation reduction act\b'
      calm:
        - Inflation cools faster than expected
        - Price pressures ease as inflation falls back toward target
        - Consumer prices are stable and the cost of living stops rising
        - Inflation slows for the third month in a row
        - Easing prices bring relief to households
      stress:
        - Inflation surges to a multi-decade high
        - Prices soar as inflation spirals out of control
        - Cost of living crisis deepens as prices keep climbing
        - Inflation comes in far hotter than expected
        - Runaway prices squeeze households

    monetary_policy:
      keywords:
        - '\bfederal reserve\b|(?-i:\bFOMC\b)|\b(the|la|der|die|della|de la) fed\b|(?-i:\bFed)(?:[’'']s\b|-)'
        - '\breserva federal\b|\bréserve fédérale\b|\briserva federale\b|\bus-notenbank\b'
        - '(?-i:\bFed\b)(?=[\s-]+(?i:chair|chief|rate|rates|policy|officials?|minutes|meeting|decision|hikes?|cuts?|governor|president|members?|signals?|holds?|raises?|lowers?|pause|pivot|watchers?|speakers?|funds|cut|hike|tightening|easing|balance))'
        - '(?-i:\bECB\b|\bEZB\b|\bBCE\b|\bBoE\b|\bBoJ\b)'
        - '\bbank of (england|japan|canada)\b|\beuropean central bank\b'
        - '\bcentral banks?\b|\bzentralbank(en)?\b|\bnotenbank(en)?\b|\bbanc[ao] centrale?\b|\bbanque centrale\b'
        - '\binterest rates?\b|\brate (hike|hikes|cut|cuts|rise|increase|decision)s?\b'
        - '\bleitzins(en)?\b|\bzins(erhöhung|senkung|wende|entscheid)\w*'
        - '\btass[io] (di interesse|d.interesse)\b|\b(taglio|rialzo|aumento) dei tassi\b'
        - '\b(tipos|tasas) de inter[eé]s\b|\b(subida|bajada|recorte) de (los )?tipos\b'
        - '\btaux (d.intérêt|directeurs?)\b|\b(hausse|baisse) des taux\b'
        - '\bpowell\b|\blagarde\b'
      exclude:
        - '\broyal bank of canada\b|\bcentral bank digital currenc|(?-i:\bCBDC\b)|\basalto al banco central\b'
        - '\bcolin powell\b|\bpowell(’|'')s funeral\b'
      calm:
        - Central bank cuts rates to support the economy
        - Fed signals a pause in rate hikes
        - Policymakers keep rates on hold as expected
        - Central bank signals easing ahead
        - Bond yields fall as rate cut hopes grow
      stress:
        - Central bank delivers surprise jumbo rate hike
        - Bond market sell-off as rate hike fears mount
        - Yields spike after hawkish central bank warning
        - Fed signals rates will stay higher for much longer
        - Emergency rate move shocks markets

    equity_markets:
      keywords:
        - '\bwall street\b|\bdow jones\b|(?-i:\bS&P ?500\b|\bNasdaq\b|\bNASDAQ\b)'
        - '(?-i:\bFTSE\b|\bDAX\b|\bCAC ?40\b|\bIBEX\b|\bIbex\b|\bNikkei\b|\bVIX\b)'
        - '\beuro ?stoxx\b|\bstoxx( europe)? ?600\b'
        - '\bstock (market|markets|exchange|exchanges)\b|\bequit(y|ies) markets?\b'
        - '\bstocks (fall|rise|slide|drop|jump|rally|tumble|plunge|surge|sink|climb|slip)\w*'
        - '\bsell-?off\b|\bbear market\b|\bbull market\b'
        - '\bbörsen?\b|\baktienmärkte?\b|\baktien\w* (fallen|steigen|brechen)'
        - '\bborsa\b|\bborse\b|\bpiazza affari\b|(?-i:\bFtse ?Mib\b)'
        - '\bbolsas? (de (madrid|valores|nueva york)|europeas|asiáticas|mundiales)\b|\bwall street\b'
        - '\bbourses?\b|\bmarchés? actions?\b'
      exclude:
        - '\((nasdaq|nyse|nysearca|nysemkt|otcmkts|lon|tse|asx|etr|nyseamerican)\s*:'
        - '\bstock (quote|price \|)|\bshort interest\b|\bprice target\b|\b(stake|holdings?|position) in\b|\b(upgraded|downgraded)\b'
      calm:
        - Stocks rise to record highs in a calm market
        - Shares rebound as investor fears ease
        - Markets steady as volatility falls
        - Equities edge higher in quiet trading
        - Investors return as stocks recover
      stress:
        - Stock market crash wipes out billions
        - Global markets plunge in panic selling
        - Volatility spikes as stocks tumble
        - Worst day for stocks in years as fear grips investors
        - Sell-off deepens as investors flee risk

    trade_tariffs:
      keywords:
        - '\btariffs?\b|\btrade (war|wars|deal|talks|tensions|dispute|truce)\b|\bimport dut(y|ies)\b'
        - '\bexport (controls?|ban|curbs)\b'
        - '\b(straf)?zölle\b|\bzollstreit\b|\bhandels(streit|krieg|abkommen|konflikt)\b'
        - '\bdazi\b|\bdazio\b|\bguerra commerciale\b'
        - '\baranceles?\b|\barancelari[ao]s?\b|\bguerra comercial\b'
        - '\bdroits de douane\b|\btarifs douaniers\b|\bguerre commerciale\b'
      exclude: []
      calm:
        - Trade deal reached and tariffs to be lifted
        - Tariff truce eases trade tensions
        - Trade talks make good progress
        - Countries agree to cut import duties
        - Exporters relieved as tariffs are suspended
      stress:
        - Trade war escalates with sweeping new tariffs
        - Retaliatory tariffs threaten global trade
        - Talks collapse as tariffs are raised again
        - Exporters brace for punishing new duties
        - Fears of a global trade war intensify

    energy:
      keywords:
        - '\boil prices?\b|\bcrude( oil)?\b|(?-i:\bOPEC\b|\bOPEP\b|\bWTI\b)|\bbrent crude\b'
        - '\b(natural )?gas prices?\b|\benergy (prices?|bills?|crisis|costs?)\b'
        - '\b(petrol|gasoline|diesel|fuel) prices?\b'
        - '\b(öl|gas|strom|energie|sprit)preis(e|en)?\b|\benergiekrise\b'
        - '\bprezz[oi] (del|dei) (petrolio|gas|carburanti|luce)\b|\bbollette\b|\bcaro (energia|bollette|carburanti)\b|\bcrisi energetica\b'
        - '\bprecios? del (petr[oó]leo|gas|crudo|combustible|luz)\b|\bcrisis energ[eé]tica\b|\bfactura de la luz\b'
        - '\bprix (du pétrole|du gaz|de l.énergie|de l.électricité|des carburants)\b|\bcrise énergétique\b'
      exclude: []
      calm:
        - Oil prices fall as supply concerns ease
        - Gas prices drop as storage fills up
        - Energy bills come down for households
        - Crude steadies as supply returns
        - Energy markets calm after weeks of turmoil
      stress:
        - Oil prices spike on supply disruption fears
        - Energy crisis deepens as gas prices hit records
        - Crude soars after attack on oil facilities
        - Households face soaring energy bills
        - Fuel prices surge as supply tightens

    geopolitics:
      keywords:
        - '\bmissiles?\b|\bair ?strikes?\b|\bceasefire\b|\bcease-fire\b|\binvasion\b|\btroops\b|\bdrone (attack|strike)s?\b|\bshelling\b'
        - '\bwar (in|on) (ukraine|gaza|israel|iran)\b|\bukraine war\b|\bnuclear (threat|weapons?)\b'
        - '\bkrieg\w*\b|\braketen\w*|\bluftangriff\w*|\bwaffenruhe\b|\btruppen\b'
        - '\bmissil[ei]\b|\braid aere[oi]\b|\bcessate il fuoco\b|\btregua\b|\binvasione\b|\bguerra\b'
        - '\bmisiles?\b|\bbombardeos?\b|\balto el fuego\b|\btropas\b|\binvasi[oó]n\b|\bguerra\b'
        - '\bfrappes?\b|\bcessez-le-feu\b|\btroupes\b|\bguerre\b'
      exclude:
        - '\btrade war\b|\bprice war\b|\bculture war\b|\bstar wars\b|\bwar on drugs\b'
        - '\bhandelskrieg\b|\bpreiskrieg\b|\bguerra (commerciale|comercial|dei prezzi|de precios)\b|\bguerre (commerciale|des prix)\b'
      calm:
        - Ceasefire agreed as peace talks advance
        - Tensions ease after diplomatic breakthrough
        - Troops withdraw as both sides agree to talks
        - Peace deal signed ending months of fighting
        - Calm returns to the border region
      stress:
        - War escalates with massive missile attack
        - Fears of wider conflict as fighting spreads
        - Invasion begins as troops cross the border
        - Deadly strikes hit the capital overnight
        - Nuclear threat raises alarm worldwide

    banking_stress:
      keywords:
        - '\bbank(ing)? (run|failure|collapse|crisis|rescue|bailout|turmoil|contagion)s?\b'
        - '\bbanks? (fail|fails|failed|collapses?|collapsed)\b|\bbank shares\b|\blenders? (collapse|fail)\w*'
        - '\bcredit (crunch|crisis)\b|\bfinancial contagion\b|\bdeposit (flight|outflows?)\b'
        - '\bsilicon valley bank\b|(?-i:\bSVB\b)|\bcredit suisse\b|\bfirst republic\b|\bsignature bank\b|\bsilvergate\b'
        - '\bbanken(krise|pleite|rettung|beben|sterben)\b|\bbankaktien\b'
        - '\bcrisi bancaria\b|\btitoli bancari\b|\bsalvataggio (della|di una) banca\b'
        - '\bcrisis bancaria\b|\brescate bancario\b|\bquiebra (de|del) (un )?banco\b'
        - '\bcrise bancaire\b|\bfaillite bancaire\b|\bvaleurs bancaires\b'
      exclude:
        - '\bstuft\b|\bprice target\b|\b(upgrade|downgrade)s?\b|\brating\b|\bearnings call\b|\bwraps up\b|\bsignature bank of georgia\b'
      calm:
        - Banks report strong results and solid capital
        - Fears of banking crisis ease after rescue
        - Regulators say the banking system is sound
        - Bank shares recover as deposits stabilise
        - Lenders pass stress tests comfortably
      stress:
        - Bank collapse sparks fears of financial contagion
        - Depositors pull billions as bank crisis spreads
        - Regulators seize failing lender
        - Bank shares plunge as panic spreads
        - Credit markets freeze as defaults rise

    growth_labor:
      keywords:
        - '\brecessions?\b|(?-i:\bGDP\b)|\bgross domestic product\b|\beconomic growth\b'
        - '\bunemployment\b|\bjobless\b|\bpayrolls?\b|\bjobs report\b|\blayoffs?\b|\bjob cuts\b'
        - '\beconomy (shrinks|contracts|grows|slows|expands)\b'
        - '\brezession\b|\bkonjunktur\w*|\bwirtschaftswachstum\b|\barbeitslos\w*|\bstellenabbau\b|(?-i:\bBIP\b)'
        - '\brecessione\b|(?-i:\bPil\b|\bPIL\b)|\bdisoccupazione\b|\bcrescita economica\b|\blicenziamenti\b'
        - '\brecesi[oó]n\b|(?-i:\bPIB\b)|\bdesempleo\b|\bcrecimiento econ[oó]mico\b|\bdespidos\b'
        - '\brécession\b|\bchômage\b|\bcroissance économique\b|\blicenciements\b'
      exclude:
        - '\b(debt|deficit|spending)\b.{0,30}\b(of|to)[- ](gdp|pil|pib|bip)\b'
      calm:
        - Economy grows strongly and hiring picks up
        - Unemployment falls to a record low
        - Growth beats expectations as recession fears fade
        - Strong jobs report shows a resilient labour market
        - Economy expands for another quarter
      stress:
        - Economy plunges into deep recession
        - Mass layoffs as unemployment soars
        - Output shrinks as recession takes hold
        - Job losses mount as companies cut staff
        - Economists warn a severe downturn is coming
